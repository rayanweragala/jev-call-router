; Route calls into the Jev router, then fall through to a safe destination.
; FreePBX: paste into /etc/asterisk/extensions_custom.conf and point a Custom Destination at jev-router,s,1.
; Plain Asterisk: add to extensions.conf and Goto(jev-router,s,1) from your inbound context.

[jev-router]
exten => s,1,NoOp(Jev call routing for ${CALLERID(num)})
 same => n,Stasis(jev-router,line=main)
 same => n,NoOp(Jev router returned the call or was unavailable: ${STASISSTATUS})
 same => n,Goto(from-did-direct,100,1)
